<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The whole-stick rule: stick kinds and broadcast reads</title><desc id="d">Cards showing a dense stick, a replicated stick (dummy dim), a sparse stick, a pad-filled stick, the two broadcast reads (scale -1 and scale -2), and the dashed style of an index-to-address conversion inserted by the backend.</desc><style>
