h="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="286.0" y="43.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">7</text><rect x="300.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="312.0" y="43.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">7</text><rect x="326.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="338.0" y="43.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">7</text><text x="246.0" y="72.0" class="t12b" text-anchor="start">Replicated (dummy dim)</text><text x="246.0" y="90.0" class="cap" text-anchor="start">One element copied into every</text><text x="246.0" y="105.0" class="cap" text-anchor="start">lane: how a single element is</text><text x="246.0" y="120.0" class="cap" text-anchor="start">made movable on its own, as a</text><text x="246.0" y="135.0" class="cap" text-anchor="start">whole stick.</text><rect x="448.0" y="14.0" width="204.0" height="146.0" rx="10" fill="#f3f2ee"/><rect x="460.0" y="26.0" width="106.0" height="26.0" rx="5" fill="#fcfcfb" stroke="#86857f" stroke-width="1"/><rect x="462.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="474.0" y="43.5" class="lane" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">7</text><rect x="488.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#fcfcfb" stroke="#dcdbd5" stroke-width="1"/><rect x="514.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#fcfcfb" stroke="#dcdbd5" stroke-width="1"/><rect x="540.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#fcfcfb" stroke="#dcdbd5" stroke-width="1"/><text x="460.0" y="72.0" class="t12b" text-anchor="start">Sparse</text><text x="460.0" y="90.0" class="cap" text-anchor="start">Only lane 0 is valid: a tensor</text><text x="460.0" y="105.0" class="cap" text-anchor="start">whose stick dim has size 1.</text><text x="460.0" y="120.0" class="cap" text-anchor="start"></text><text x="460.0" y="135.0" class="cap" text-anchor="start"></text><rect x="662.0" y="14.0" width="204.0" height="146.0" rx="10" fill="#f3f2ee"/><rect x="674.0" y="26.0" width="106.0" height="26.0" rx="5" fill="#fcfcfb" stroke="#86857f" stroke-width="1"/><rect x="676.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#f3f2ee"/><text x="688.0" y="43.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">8</text><rect x="702.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#f3f2ee"/><text x="714.0" y="43.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">8</text><rect x="728.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#f3f2ee"/><text x="740.0" y="43.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">8</text><rect x="754.0" y="28.0" width="24.0" height="22.0" rx="3" fill="#f3f2ee"/><text x="766.0" y="43.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">8</text><text x="674.0" y="72.0" class="t12b" text-anchor="start">Pad-filled</text><text x="674.0" y="90.0" class="cap" text-anchor="start">The pad token Tq in every lane:</text><text x="674.0" y="105.0" class="cap" text-anchor="start">how every slot of tok_dst</text><text x="674.0" y="120.0" class="cap" text-anchor="start">starts (A17a).</text><text x="674.0" y="135.0" class="cap" text-anchor="start"></text><rect x="20.0" y="172.0" width="280.0" height="140.0" rx="10" fill="#f3f2ee"/><rect x="32.0" y="184.0" width="106.0" height="26.0" rx="5" fill="#fcfcfb" stroke="#86857f" stroke-width="1"/><rect x="34.0" y="186.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="46.0" y="201.5" class="lane" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">7</text><rect x="60.0" y="186.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="72.0" y="201.5" class="lane" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">7</text><rect x="86.0" y="186.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="98.0" y="201.5" class="lane" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">7</text><rect x="112.0" y="186.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="124.0" y="201.5" class="lane" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">7</text><text x="32.0" y="230.0" class="t12b" text-anchor="start">Read with scale −1</text><text x="32.0" y="248.0" class="cap" text-anchor="start">A whole stick reused along a dim the</text><text x="32.0" y="263.0" class="cap" text-anchor="start">operand does not have (e.g. seed in</text><text x="32.0" y="278.0" class="cap" text-anchor="start">A13, tok_ids over K in A17b).</text><rect x="310.0" y="172.0" width="280.0" height="140.0" rx="10" fill="#f3f2ee"/><rect x="322.0" y="184.0" width="106.0" height="26.0" rx="5" fill="#fcfcfb" stroke="#86857f" stroke-width="1"/><rect x="324.0" y="186.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="336.0" y="201.5" class="lane" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">7</text><rect x="350.0" y="186.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="362.0" y="201.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">7</text><rect x="376.0" y="186.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="388.0" y="201.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">7</text><rect x="402.0" y="186.0" width="24.0" height="22.0" rx="3" fill="#e9e8e3"/><text x="414.0" y="201.5" class="lane" text-anchor="middle" fill="#86857f" style="fill:#86857f">7</text><text x="322.0" y="230.0" class="t12b" text-anchor="start">Read with scale −2</text><text x="322.0" y="248.0" class="cap" text-anchor="start">Lane 0 of a sparse stick spread across</text><text x="322.0" y="263.0" class="cap" text-anchor="start">all lanes (a broadcast within a stick).</text><text x="322.0" y="278.0" class="cap" text-anchor="start"></text><rect x="600.0" y="172.0" width="260.0" height="140.0" rx="10" fill="#f3f2ee"/><rect x="612.0" y="184.0" width="76.0" height="30.0" rx="7" fill="#fcfcfb" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="622.0" y="204.0" class="t13 it" text-anchor="start">A22i</text><text x="612.0" y="230.0" class="t12b" text-anchor="start">Inserted by the backend</text><text x="612.0" y="248.0" class="cap" text-anchor="start">idx2Addr in front of the op it feeds;</text><text x="612.0" y="263.0" class="cap" text-anchor="start">not emitted by the frontend. Named</text><text x="612.0" y="278.0" class="cap" text-anchor="start">after its consumer with an i suffix.</text></svg>
